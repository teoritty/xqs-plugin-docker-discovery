name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The same gate CI runs. A tag must not produce artifacts the branch could not.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build and pack
        run: make pack

      - name: Check the manifest version matches the tag
        # A bundle whose plugin.json says one version while the release says another is the kind of
        # mismatch nobody notices until an upgrade silently does nothing.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' plugin.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match plugin.json version $manifest" >&2
            exit 1
          fi

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          # Pre-release, deliberately: this build has never run against a live Docker daemon or the
          # host's UI. Everything below the transport is covered by tests; the first contact with a
          # real daemon is still ahead.
          prerelease: true
          generate_release_notes: true
          files: dist/*.xqsp
          body: |
            **Pre-release.** Not yet verified against a live Docker daemon or the host UI.

            ### Requires an unreleased host
            This plugin uses the `ui` capability (ADR-015): plugin-owned tabs, dialogs and the node
            details panel. That capability is not in any released xQuakShell — it lives on the
            `feat/adr-015-plugin-ui-surfaces` branch. Installing this on a current release will fail
            capability negotiation at load with `-32009`, which is the host correctly refusing a
            plugin it cannot serve.

            ### What is covered by tests
            Frame codec, JSON-RPC client, channel flow control, the Engine API client and its stream
            demultiplexer, status-tone mapping and node-id validation — all under `-race`. The
            manifest is validated against the host's own validator.

            ### What is not
            The response of a real `docker system dial-stdio`, a live `/events` stream, a hijacked
            `exec`, and how any of the panels look.

            ### Install
            Settings → Plugins → Install bundle… and pick the `.xqsp` for your platform. The install
            asks for consent to run commands over your authenticated session; the plugin declares
            exactly one, `docker system dial-stdio`.
