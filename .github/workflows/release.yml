name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The same gate CI runs. A tag must not produce artifacts the branch could not.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build and pack
        run: make pack

      # Two shapes, because the host has two install routes and they want different things.
      #
      # "Add GitHub repository" reads xqsp.json from the repo, then downloads ONE asset per
      # platform and stages it next to a manifest it writes itself. Its asset-name parser strips
      # .exe/.zip/.tar.gz and nothing else, so a .xqsp name yields no platform at all and the
      # install reports the platform as unsupported. That route needs the bare binaries below.
      #
      # "Install bundle…" takes a .xqsp, which is the only shape that also carries ui/icons — the
      # GitHub route stages just the binary and the manifest, so a plugin installed that way draws
      # its tree without icons.
      - name: Stage release binaries
        run: |
          mkdir -p dist/release
          cp dist/bin/windows-amd64/xqs-docker.exe dist/release/xqs-docker-windows-amd64.exe
          cp dist/bin/linux-amd64/xqs-docker       dist/release/xqs-docker-linux-amd64
          cp dist/bin/darwin-amd64/xqs-docker      dist/release/xqs-docker-darwin-amd64
          cp dist/bin/darwin-arm64/xqs-docker      dist/release/xqs-docker-darwin-arm64
          cp dist/*.xqsp dist/release/
          cd dist/release && sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Check xqsp.json and plugin.json agree
        # They are two files carrying the same manifest for two install routes. Letting them drift
        # means one route installs a plugin the other would refuse, and nothing says which is right.
        run: |
          for field in id version; do
            a=$(grep -o "\"$field\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" plugin.json | head -1)
            b=$(grep -o "\"$field\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" xqsp.json  | head -1)
            if [ "$a" != "$b" ]; then
              echo "plugin.json and xqsp.json disagree on $field: [$a] vs [$b]" >&2
              exit 1
            fi
          done

      - name: Check the manifest version matches the tag
        # A bundle whose plugin.json says one version while the release says another is the kind of
        # mismatch nobody notices until an upgrade silently does nothing.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' plugin.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match plugin.json version $manifest" >&2
            exit 1
          fi

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          # Still a pre-release: it now runs against a real daemon, but the host half it needs has
          # not shipped in any xQuakShell release.
          prerelease: true
          generate_release_notes: true
          files: |
            dist/release/*
          body: |
            **Pre-release.** Runs against a live Docker daemon; the host it needs is unreleased.

            ### Requires an unreleased host
            This plugin uses the `ui` capability (ADR-015): plugin-owned tabs, dialogs and the node
            details panel. That capability is not in any released xQuakShell — it lives on the
            `feat/adr-015-plugin-ui-surfaces` branch. Installing this on a current release will fail
            capability negotiation at load with `-32009`, which is the host correctly refusing a
            plugin it cannot serve.

            The Delete key over a selection needs a host that understands an action's `delete` flag.
            On an older one the flag is ignored and the key does nothing; the Remove… menu entry
            works either way.

            ### What is covered by tests
            Frame codec, JSON-RPC client, channel flow control, the Engine API client and its stream
            demultiplexer, status-tone mapping, usage derivation for images, volumes and networks,
            node-id validation, and that one selection asks exactly one question — all under
            `-race`. The manifest is validated against the host's own validator.

            ### What is not
            A live `/events` stream and how the panels look under every theme.

            ### Install
            Two routes, and they differ in what arrives:

            - **Settings → Plugins → Install bundle…** with the `.xqsp` for your platform. This is
              the complete bundle, icons included.
            - **Add GitHub repository** reads `xqsp.json` and downloads the bare binary for your
              platform. The host stages only the binary and the manifest, so the tree renders
              without its icons — everything else works.

            Either way the install asks for consent to run commands over your authenticated
            session; the plugin declares exactly one, `docker system dial-stdio`.
