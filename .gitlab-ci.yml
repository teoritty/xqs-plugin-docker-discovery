# CI/CD for the xQuakShell Docker discovery plugin.
#
#   * On a branch or merge request: go vet and the race-tested suite. Nothing is
#     published.
#
#   * On a tag vX.Y.Z: the same gates run again — a tag must never produce
#     artifacts a branch could not — then all platforms are packed, uploaded to
#     this project's generic package registry, and attached to a GitLab Release
#     as asset links.
#
# Two asset shapes, because the host has two install routes that want different
# things:
#   * The .xqsp bundle carries ui/ (the tree icons) and is what "Install bundle…"
#     and a bundle-aware host download install.
#   * The bare binary is all an older host installs from a repository; it stages
#     just the binary and a manifest, so that route renders the tree without its
#     icons — everything else works.
#
# The host reads a GitLab release's `assets.links` and downloads by
# `direct_asset_url`; `filepath` on each link is what makes GitLab mint that
# permalink (…/-/releases/<tag>/downloads/<name>).

stages:
  - test
  - package
  - release

variables:
  # Matches go.mod (go 1.25). The golang image ships make and gcc, which `make
  # pack` and `go test -race` both need.
  GO_IMAGE: "golang:1.25"
  PKG_NAME: "docker"
  GOPATH: "$CI_PROJECT_DIR/.gopath"
  GOCACHE: "$CI_PROJECT_DIR/.gocache"
  GOMODCACHE: "$CI_PROJECT_DIR/.gomodcache"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: "$GO_IMAGE"
  cache:
    key:
      files:
        - go.mod
    paths:
      - .gocache/
      - .gomodcache/
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - test -z "$(gofmt -l .)" || { echo 'gofmt reports unformatted files:'; gofmt -l .; exit 1; }
    - go vet ./...
    - go test ./... -count=1 -race

package:
  stage: package
  image: "$GO_IMAGE"
  cache:
    key:
      files:
        - go.mod
    paths:
      - .gocache/
      - .gomodcache/
    policy: pull
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    # A tag must not produce artifacts the branch could not.
    - test -z "$(gofmt -l .)" || { echo 'gofmt reports unformatted files:'; gofmt -l .; exit 1; }
    - go vet ./...
    - go test ./... -count=1 -race

    # The two manifests carry the same identity for two install routes; if they
    # disagree, one route installs a plugin the other refuses.
    - |
      for field in id version; do
        a=$(grep -o "\"$field\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" plugin.json | head -1)
        b=$(grep -o "\"$field\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" xqsp.json  | head -1)
        if [ "$a" != "$b" ]; then
          echo "plugin.json and xqsp.json disagree on $field: [$a] vs [$b]" >&2
          exit 1
        fi
      done

    # A bundle whose manifest version differs from the release tag is the kind of
    # mismatch nobody notices until an upgrade silently does nothing.
    - |
      tag="${CI_COMMIT_TAG#v}"
      manifest=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' plugin.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
      if [ "$tag" != "$manifest" ]; then
        echo "tag $tag does not match plugin.json version $manifest" >&2
        exit 1
      fi

    # Cross-compile every platform and pack a bundle each (plugin.json with
    # engine.entry set per platform, the binary, and the ui/ icons).
    - make pack

    # Stage both shapes: bare binaries (renamed with their platform) and every
    # .xqsp, plus one release-level SHA256SUMS over the set.
    - mkdir -p dist/release
    - cp dist/bin/windows-amd64/xqs-docker.exe dist/release/xqs-docker-windows-amd64.exe
    - cp dist/bin/linux-amd64/xqs-docker       dist/release/xqs-docker-linux-amd64
    - cp dist/bin/darwin-amd64/xqs-docker      dist/release/xqs-docker-darwin-amd64
    - cp dist/bin/darwin-arm64/xqs-docker      dist/release/xqs-docker-darwin-arm64
    - cp dist/*.xqsp dist/release/
    - cd dist/release && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd "$CI_PROJECT_DIR"

    # Upload each asset to the generic package registry. --fail turns any non-2xx
    # into a job failure instead of a release that links a file that isn't there.
    - |
      for f in dist/release/*; do
        name=$(basename "$f")
        echo "uploading $name"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${CI_COMMIT_TAG}/${name}"
      done
  artifacts:
    name: "xqs-plugin-docker-$CI_COMMIT_TAG"
    paths:
      - dist/release/
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Docker discovery $CI_COMMIT_TAG"
    description: |
      **Pre-release.** Runs against a live Docker daemon; the host capability it
      needs is not in any released xQuakShell yet.

      This plugin uses the `ui` capability (plugin-owned tabs, dialogs and the
      node details panel), which lives on an unreleased host branch. Installing it
      on a current release fails capability negotiation at load with `-32009` —
      the host correctly refusing a plugin it cannot serve.

      ### Assets
      Two shapes for the host's two install routes:
      `xqs-docker-<os>-<arch>.xqsp` — the bundle, icons included, for
      **Install bundle…** and a bundle-aware **Add repository**.
      `xqs-docker-<os>-<arch>[.exe]` — the bare binary, for a host that installs
      only binaries from a repository; the tree then renders without its icons.
      A release-level `SHA256SUMS` covers every asset. Bundles are unsigned.

      ### Install
      Either route asks for consent to run commands over your authenticated
      session; the plugin declares exactly one, `docker system dial-stdio`.
    assets:
      links:
        - name: "xqs-docker-windows-amd64.xqsp"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-windows-amd64.xqsp"
          filepath: "/xqs-docker-windows-amd64.xqsp"
          link_type: "package"
        - name: "xqs-docker-linux-amd64.xqsp"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-linux-amd64.xqsp"
          filepath: "/xqs-docker-linux-amd64.xqsp"
          link_type: "package"
        - name: "xqs-docker-darwin-amd64.xqsp"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-darwin-amd64.xqsp"
          filepath: "/xqs-docker-darwin-amd64.xqsp"
          link_type: "package"
        - name: "xqs-docker-darwin-arm64.xqsp"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-darwin-arm64.xqsp"
          filepath: "/xqs-docker-darwin-arm64.xqsp"
          link_type: "package"
        - name: "xqs-docker-windows-amd64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-windows-amd64.exe"
          filepath: "/xqs-docker-windows-amd64.exe"
          link_type: "other"
        - name: "xqs-docker-linux-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-linux-amd64"
          filepath: "/xqs-docker-linux-amd64"
          link_type: "other"
        - name: "xqs-docker-darwin-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-darwin-amd64"
          filepath: "/xqs-docker-darwin-amd64"
          link_type: "other"
        - name: "xqs-docker-darwin-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/xqs-docker-darwin-arm64"
          filepath: "/xqs-docker-darwin-arm64"
          link_type: "other"
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/docker/${CI_COMMIT_TAG}/SHA256SUMS"
          filepath: "/SHA256SUMS"
          link_type: "other"
